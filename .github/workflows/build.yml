name: Build & Release Packages

on:
  push:
    tags:
      - "v*"
      - "*-beta"
      - "*-dev"
  workflow_dispatch:

jobs:
  # Briefcase for AppImages, deb and rpm (replaces custom script and fpm)
  build:
    name: Build ${{ matrix.format }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, deb, rpm]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-dev \
            libfuse2 binutils \
            debhelper devscripts \
            rpm  # Needed for the RPM matrix job

      - name: Build Package
        run: |
          briefcase package linux ${{ matrix.format }} --no-docker --non-interactive

      - name: Generate Checksums
        run: |
          cd dist
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') }}
          generate_release_notes: true[build-system]
